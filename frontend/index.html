<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dingle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <span class="brand">dingle</span>
</header>

<main class="card">
  <button id="playBtn" class="play-btn" aria-label="Play snippet">▶</button>

  <div id="progressBar" class="progress-bar">
    <div id="progressTarget" class="progress-target"></div>
    <div id="progressFill" class="progress-fill"></div>
    <div id="progressTicks" class="progress-ticks"></div>
  </div>

  <div class="guess-row">
    <div class="guess-field">
      <input id="guessInput" type="text" placeholder="Guess the song…" autocomplete="off">
      <ul id="suggestions" class="suggestions hidden"></ul>
    </div>
    <button id="skipBtn" class="secondary-btn">Skip</button>
  </div>

  <div id="revealSection" class="reveal-section">
    <div class="reveal-section-inner">
      <div id="reveal" class="reveal">
        <img id="revealCover" alt="">
        <div>
          <div id="revealTitle" class="reveal-title"></div>
          <div id="revealArtist" class="reveal-artist"></div>
        </div>
        <button id="retryAudioBtn" class="remove-btn" title="Wrong audio — try another match">🔄</button>
        <button id="removeSongBtn" class="remove-btn" title="Remove this song from the pool">✕</button>
      </div>

      <div class="offset-editor">
        <div class="offset-top-row">
          <span class="offset-label">Snippet start: <span id="offsetValue">0.0s</span></span>
          <button id="previewFirstHintBtn" class="offset-btn" title="Play exactly what the first hint sounds like">▶ 0.2s hint</button>
        </div>
        <div class="offset-controls">
          <button id="offsetMinusBig" class="offset-btn" title="-0.5s">−0.5</button>
          <button id="offsetMinus" class="offset-btn" title="-0.1s">−0.1</button>
          <button id="offsetPlus" class="offset-btn" title="+0.1s">+0.1</button>
          <button id="offsetPlusBig" class="offset-btn" title="+0.5s">+0.5</button>
        </div>
      </div>

      <button id="nextBtn" class="primary-btn">Next song</button>
    </div>
  </div>
</main>

<div id="ytPlayer" class="yt-player"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="app.js"></script>
</body>
</html>
