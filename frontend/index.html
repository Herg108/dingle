<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dingle</title>
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1115'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%233ddc84'/%3E%3Cpath d='M13.6 11.8l6.2 4.2-6.2 4.2z' fill='%230f1115'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <span class="brand">dingle</span>
  <div class="topbar-right">
    <div class="volume">
      <button id="volumeBtn" class="volume-btn" aria-label="Mute">
        <svg id="volumeIcon" class="volume-icon level-2" viewBox="0 0 20 20" aria-hidden="true">
          <path class="vol-cone"
                d="M9.5 4.2 L5.6 7.6 H3.2 A1.2 1.2 0 0 0 2 8.8 v2.4 A1.2 1.2 0 0 0 3.2 12.4 H5.6 L9.5 15.8 Z"/>
          <path class="vol-wave vol-wave-1" d="M11.9 7.9 a2.6 2.6 0 0 1 0 4.2"/>
          <path class="vol-wave vol-wave-2" d="M14.2 6 a6 6 0 0 1 0 8"/>
          <path class="vol-slash" d="M12.6 7.8 L17 12.2"/>
          <path class="vol-slash" d="M17 7.8 L12.6 12.2"/>
        </svg>
      </button>
      <input id="volumeSlider" class="volume-slider" type="range"
             min="0" max="100" step="1" value="100" aria-label="Volume">
    </div>
    <button id="reviewBtn" class="filters-btn review-btn">
      Review<span id="reviewBadge" class="filters-count"></span>
    </button>
    <button id="filtersBtn" class="filters-btn" aria-expanded="false">
      Filters<span id="filtersCount" class="filters-count hidden"></span>
    </button>
  </div>
</header>

<div id="filterPanel" class="filter-panel">
  <div class="filter-panel-inner">
    <div class="filter-group">
      <div class="filter-group-head">
        <span class="filter-group-title">Era</span>
        <button class="filter-all" data-group="era">All</button>
      </div>
      <div id="eraChips" class="chip-row"></div>
    </div>

    <div class="filter-group">
      <div class="filter-group-head">
        <span class="filter-group-title">Genre</span>
        <button class="filter-all" data-group="genre">All</button>
      </div>
      <div id="genreChips" class="chip-row"></div>
    </div>

    <div class="filter-footer">
      <span id="filterSummary" class="filter-summary"></span>
      <span id="filterNote" class="filter-note"></span>
    </div>
  </div>
</div>

<main class="card">
  <button id="playBtn" class="play-btn" aria-label="Play snippet">
    <span id="playIcon" class="play-icon">▶</span>
    <span class="play-spinner"></span>
  </button>

  <div id="progressBar" class="progress-bar">
    <div id="progressTarget" class="progress-target"></div>
    <div id="progressFill" class="progress-fill"></div>
    <div id="progressTicks" class="progress-ticks"></div>
  </div>

  <div id="guessRow" class="guess-row">
    <div class="guess-field">
      <input id="guessInput" type="text" placeholder="Guess the song…" autocomplete="off">
      <ul id="suggestions" class="suggestions hidden"></ul>
    </div>
    <button id="actionBtn" class="secondary-btn"><span id="actionLabel">Skip</span></button>
  </div>

  <div id="revealSection" class="reveal-section">
    <div class="reveal-section-inner">
      <div id="reveal" class="reveal">
        <img id="revealCover" alt="">
        <div>
          <div id="revealTitle" class="reveal-title"></div>
          <div id="revealArtist" class="reveal-artist"></div>
        </div>
        <button id="retryAudioBtn" class="remove-btn" title="Wrong audio — try another match">🔄</button>
        <button id="removeSongBtn" class="remove-btn" title="Remove this song from the pool">✕</button>
      </div>

      <div class="offset-editor">
        <div class="offset-top-row">
          <span class="offset-label">Snippet start: <span id="offsetValue">0.0s</span></span>
          <button id="previewFirstHintBtn" class="offset-btn" title="Play exactly what the first hint sounds like">▶ 0.2s hint</button>
        </div>
        <div class="offset-controls">
          <button id="offsetMinusBig" class="offset-btn" title="-0.5s">−0.5</button>
          <button id="offsetMinus" class="offset-btn" title="-0.1s">−0.1</button>
          <button id="offsetPlus" class="offset-btn" title="+0.1s">+0.1</button>
          <button id="offsetPlusBig" class="offset-btn" title="+0.5s">+0.5</button>
        </div>

        <div class="review-controls">
          <span id="reviewProgress" class="review-progress"></span>
          <button id="reviewSkipBtn" class="offset-btn" title="Leave it queued and move on">Skip</button>
          <button id="reviewApproveBtn" class="review-approve" title="Mark checked and put it into rotation">Approve →</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="ytPlayer" class="yt-player"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="app.js"></script>
</body>
</html>
